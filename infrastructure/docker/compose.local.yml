name: showora-local
services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: showora_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm local:env first}
      POSTGRES_DB: showora
    ports: ['127.0.0.1:55432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../.local/bootstrap.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U showora_migrator -d showora']
      interval: 5s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  postgres-data:
